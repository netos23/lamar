name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      OPAMYES: "true"
      OPAMSOLVERTIMEOUT: "400"
      OCAML_VERSION: "4.14.2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake opam m4 pkg-config gcc-14-multilib xdot

      - name: Install Lama via opam
        run: |
          opam init -y --disable-sandboxing
          opam switch create lama --packages=ocaml-variants.${OCAML_VERSION}+options,ocaml-option-flambda --yes
          eval "$(opam env --switch=lama --set-switch)"
          opam pin add Lama https://github.com/PLTools/Lama.git#1.30 --no-action --yes
          opam install Lama --yes
          opam env --switch=lama --set-switch --shell=sh >> "$GITHUB_ENV"
          if ! LAMAC_BIN="$(which lamac)"; then
            echo "::error::lamac executable not found via which" >&2
            exit 1
          fi
          if [ ! -x "$LAMAC_BIN" ]; then
            echo "::error::LAMAC_BIN=$LAMAC_BIN is not executable" >&2
            exit 1
          fi
          echo "LAMAC_BIN=${LAMAC_BIN}" >> "$GITHUB_ENV"

      - name: Configure CMake (Release)
        run: cmake -S . -B cmake-build-release -DCMAKE_BUILD_TYPE=Release

      - name: Build lamar, byterun, and analyzer (Release)
        run: cmake --build cmake-build-release --config Release --target lamar byterun lamar_analyzer lamar_disassembler -- -j2

      - name: Build tests
        run: |
          ./scripts/make_examples.sh
          ./scripts/make_perf.sh

      - name: Run bytecode disassembly tests
        env:
          LAMAR_DISASSEMBLER_BIN: ${{ github.workspace }}/cmake-build-release/lamar_disassembler
        run: ./test/run_disassemble_all.sh

# Fails on GitHub Actions
#      - name: Run bytecode disassembly tests
#        env:
#          BYTERUN_BIN: ${{ github.workspace }}/cmake-build-release/third_party/Lama/byterun/byterun
#          LAMAR_DISASSEMBLER_BIN: ${{ github.workspace }}/cmake-build-release/lamar_disassembler
#        run: ./test/run_bc_compare.sh
#      - name: Run analyzer performance tests
#        env:
#          ANALYZER_BIN: ${{ github.workspace }}/cmake-build-release/lamar_analyzer
#        run: ./test/run_analyzer_perf.sh

      - name: Run regression tests
        env:
          LAMAR_BIN: ${{ github.workspace }}/cmake-build-release/lamar
        run: ./test/run_bc_io.sh

      - name: Run performance tests
        env:
          LAMAR_BIN: ${{ github.workspace }}/cmake-build-release/lamar
        run: ./test/run_performance.sh
